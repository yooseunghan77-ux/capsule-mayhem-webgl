<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Capsule Mayhem</title>
  <style>
    /* 캔버스가 창을 채우게 한다. 게임 카메라가 화면비를 보고 배경 전체를 담도록 맞춘다
       (Bootstrap.FitCamera) — 가로가 넓으면 좌우, 좁으면 위아래에 여백이 생길 뿐 잘리지 않는다. */
    html, body { margin: 0; height: 100%; background: #141414; overflow: hidden; }
    #unity-container { position: absolute; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #141414; }
    #unity-loading { position: absolute; left: 0; right: 0; top: 46%; text-align: center;
                     color: #cbb; font: 14px/1.6 ui-monospace, monospace; }
    #unity-bar { width: 260px; height: 6px; margin: 10px auto 0; background: #333; }
    #unity-fill { width: 0; height: 100%; background: #e8d27a; }
    #unity-warn { position: absolute; left: 8px; bottom: 8px; color: #f88;
                  font: 12px ui-monospace, monospace; white-space: pre; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">Capsule Mayhem — loading <span id="unity-pct">0</span>%
      <div id="unity-bar"><div id="unity-fill"></div></div>
    </div>
    <div id="unity-warn"></div>
  </div>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    createUnityInstance(canvas, {
      dataUrl: "Build/WebGL.data",
      frameworkUrl: "Build/WebGL.framework.js",
      codeUrl: "Build/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "SpriteForge",
      productName: "Capsule Mayhem",
      productVersion: "1.0",
      showBanner: function (msg, type) {
        document.querySelector("#unity-warn").textContent += msg + "\n";
      },
    }, function (p) {
      document.querySelector("#unity-pct").textContent = Math.round(p * 100);
      document.querySelector("#unity-fill").style.width = (p * 100) + "%";
    }).then(function () {
      document.querySelector("#unity-loading").style.display = "none";
      canvas.focus();
    }).catch(function (e) {
      document.querySelector("#unity-warn").textContent += "로딩 실패: " + e + "\n";
    });
  </script>
</body>
</html>
